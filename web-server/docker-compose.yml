# Generated by dox: web deployment v1
# Commit this file and your library to its private Git repository.
# Dokploy: Docker Compose, path web/docker-compose.yml, service web, port 3000,
# with an HTTPS domain. Requires Compose 2.17+ and BuildKit named contexts.
# One-time setup at the library root:
#   git submodule add https://github.com/zrho/dox.git web/dox
# Commit .gitmodules, web/dox, and this file. Enable submodules in Dokploy;
# its checkout credentials need access to both the library and dox repositories.
# Set DOX_WEB_PASSWORD in Dokploy's Environment panel (runtime only).
# Rebuild to publish committed notes using the recorded dox submodule revision.
# Note-only builds reuse the compiler layer while Docker retains its cache.
# To update dox externally: git submodule update --remote --checkout -- web/dox
# Review and commit the new submodule reference before deploying it.
# Changing DOX_WEB_PASSWORD only requires recreating the service container.
services:
  web:
    build:
      context: ..
      additional_contexts:
        dox: ./dox
      args:
        LIBRARY_NAME: __DOX_LIBRARY_NAME__
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM rust:1-bookworm AS compiler
        SHELL ["/bin/bash", "-o", "pipefail", "-c"]
        RUN apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates pkg-config libssl-dev && rm -rf /var/lib/apt/lists/*
        WORKDIR /src
        # Keep library files, checkout metadata, and root build artifacts out
        # of the compiler inputs so note edits cannot invalidate this layer.
        COPY --from=dox /Cargo.toml /Cargo.lock ./
        COPY --from=dox /crates/ ./crates/
        COPY --from=dox /packages/ ./packages/
        COPY --from=dox /web-reader/ ./web-reader/
        COPY --from=dox /web-server/ ./web-server/
        RUN --mount=type=cache,target=/usr/local/cargo/registry \
            --mount=type=cache,target=/src/target \
            cargo build --locked --release -p dox-cli && \
            cp target/release/dox /usr/local/bin/dox

        FROM compiler AS renderer
        ARG LIBRARY_NAME
        RUN mkdir -p "/libraries/$${LIBRARY_NAME}" /output
        RUN --mount=type=bind,source=.,target=/input \
            tar -C /input --exclude='./.git' --exclude='./.cache' \
              --exclude='./.trash' --exclude='./web' --exclude='./.env' \
              --exclude='./.env.*' -cf - . | tar -C "/libraries/$${LIBRARY_NAME}" -xf -
        RUN dox --library "/libraries/$${LIBRARY_NAME}" export-web /output/public

        FROM node:24-bookworm-slim AS website
        ENV NODE_ENV=production PORT=3000
        WORKDIR /app
        COPY --from=renderer --chown=node:node /output/public /app/public
        COPY --from=dox --chown=node:node /web-server/server.mjs /app/server/server.mjs
        USER node
        EXPOSE 3000
        CMD ["node", "server/server.mjs"]
    environment:
      DOX_WEB_PASSWORD: "${DOX_WEB_PASSWORD:?Set DOX_WEB_PASSWORD in Dokploy}"
    expose:
      - "3000"
    restart: unless-stopped
