[package]
name = "nsh-app-dox-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
dom_query = "0.28"
dox-core = { path = "../dox-core" }
futures-channel = "0.3"
nsh-base = { version = "=0.6.1", default-features = false, features = ["editor"] }
nsh-core = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-syntax = "=0.15.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17", default-features = false }
