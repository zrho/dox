[package]
name = "dox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
biblatex = "0.12"
serde.workspace = true
serde_json.workspace = true
rand = "0.9"
regex = "1"
dom_query = "0.28"
jiff = "0.2"
notify = "8"
sha2 = "0.10"
tempfile = "3"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
percent-encoding = "2"
roxmltree = "0.21"
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-as-lib = { version = "=0.17.0", features = ["typst-html", "typst-kit-fonts", "typst-kit-embed-fonts", "packages", "reqwest"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
